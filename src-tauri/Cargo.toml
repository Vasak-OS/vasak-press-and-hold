[package]
name = "vasak-press-and-hold"
version = "0.2.2"
description = "Press & Hold Accents daemon for Wayland"
authors = ["Vasak Group", "Joaquin (Pato) Decima"]
edition = "2021"

[lib]
name = "vasak_press_and_hold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-config-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = "0.18"
gtk-layer-shell = "0.8"
evdev = "0.12"
xkbcommon = "0.7"
libc = "0.2"
base64 = "0.22"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# Para escuchar `PrepareForSleep` de logind: es lo que avisa que la máquina se
# va a dormir y que despertó. Sin eso el daemon se queda con teclados tomados
# que ya no leen nada. La API bloqueante alcanza —vive en su propio hilo— y así
# no entra tokio.
zbus = "4"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1  # Allows LLVM to perform better optimization.
lto = "thin"       # Thin LTO: ~90% de fat LTO, compila mucho más rápido.
opt-level = 3      # Máxima optimización de velocidad.
panic = "abort"    # Higher performance by disabling panic handlers.
strip = true       # Ensures debug symbols are removed.
