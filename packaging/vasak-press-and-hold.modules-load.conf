# Loads uinput at boot, which is what turns /dev/uinput into a real device.
#
# The node exists from boot regardless — systemd creates it from the kernel's
# modules.devname — but as a static node with no driver behind it and no uevent,
# so udev never applies the `uaccess` tag that grants the person at the keyboard
# access to it. Loading the module makes the device appear for real, and from
# there the rule does its job.
uinput
